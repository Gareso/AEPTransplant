<svg viewBox="0 0 382 302" xmlns="http://www.w3.org/2000/svg" font-family="Arial">
  <!-- client/preview-settings.html at its manifest size (380 x 300): 16px
       padding, 12px gaps, laid out from the page rendered at that size. -->
  <rect x="0.5" y="0.5" width="381" height="301" rx="10" fill="#2b2b2b" stroke="#444"/>

  <text x="17" y="29" font-size="13" font-weight="700" fill="#e0e0e0">Preview Settings</text>

  <g font-size="11.5" fill="#9a9a9a">
    <text x="17" y="57">What the eye button shows. Comps are rendered by After Effects</text>
    <text x="17" y="75">in the background, and video footage plays straight from its file.</text>
  </g>

  <!-- Mode: Animated (selected) -->
  <g font-size="12" fill="#e0e0e0">
    <circle cx="23.5" cy="104" r="6" fill="none" stroke="#4d9fff" stroke-width="1.3"/>
    <circle cx="23.5" cy="104" r="3.3" fill="#4d9fff"/>
    <text x="36" y="108">Animated, the first</text>
    <rect x="146.5" y="92.5" width="51" height="23" rx="5" fill="#232323" stroke="#444"/>
    <text x="153" y="108">2</text>
    <text x="204" y="108">seconds</text>

    <!-- Mode: Still frame, its field disabled while Animated is chosen -->
    <circle cx="23.5" cy="136" r="6" fill="#2b2b2b" stroke="#d0d0d0" stroke-width="1"/>
    <text x="36" y="140">A still frame, at</text>
    <g opacity="0.5">
      <rect x="130.5" y="124.5" width="51" height="23" rx="5" fill="#232323" stroke="#444"/>
      <text x="137" y="140">1</text>
    </g>
    <text x="188" y="140">seconds</text>
  </g>
  <line x1="17" y1="160.5" x2="365" y2="160.5" stroke="#3a3a3a"/>

  <!-- Cache -->
  <text x="17" y="184" font-size="12" font-weight="700" fill="#e0e0e0">Cache</text>
  <text x="17" y="214" font-size="12" fill="#9a9a9a">14 previews, 21.6 MB</text>
  <rect x="270.5" y="195.5" width="94" height="29" rx="5" fill="#232323" stroke="#444"/>
  <text x="317.5" y="214" font-size="12" fill="#e0e0e0" text-anchor="middle">Clear Cache</text>
  <line x1="17" y1="236.5" x2="365" y2="236.5" stroke="#3a3a3a"/>

  <!-- Footer: Close, pushed to the bottom -->
  <rect x="306.5" y="255.5" width="58" height="29" rx="5" fill="#232323" stroke="#444"/>
  <text x="335.5" y="274" font-size="12" fill="#e0e0e0" text-anchor="middle">Close</text>
</svg>
