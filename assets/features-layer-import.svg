<svg viewBox="0 0 360 216" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Arial">
  <defs>
    <!-- Icons below are the literal paths client/main.js renders, left in
         their 0-24 coordinate space and re-centred + scaled here. -->
    <g id="type-comp"><g transform="scale(0.5) translate(-12,-12)" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="12 2 2 7 12 12 22 7"/>
      <polyline points="2 17 12 22 22 17"/>
      <polyline points="2 12 12 17 22 12"/>
    </g></g>
    <g id="layer-text"><g transform="scale(0.5) translate(-12,-12)" fill="#9a9a9a">
      <path d="M4 4h16v3h-6v13h-4V7H4V4z"/>
    </g></g>
    <g id="layer-scaffold"><g transform="scale(0.5) translate(-12,-12)" fill="none" stroke="#9a9a9a" stroke-width="2">
      <path d="M4 4h16v16H4V4z"/>
    </g></g>
    <g id="target-icon"><g transform="scale(0.5417) translate(-12,-12)" fill="none" stroke-width="2">
      <circle cx="12" cy="12" r="7"/>
      <line x1="12" y1="1" x2="12" y2="23"/>
      <line x1="1" y1="12" x2="23" y2="12"/>
    </g></g>
    <g id="checkbox-off"><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.3"/></g>
    <g id="checkbox-on"><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="#4d9fff"/><path d="M-3.3,0.3 L-1.3,2.3 L3.3,-2.7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- .crumb-back chevron: 8x8 viewBox, stroke-width 1.4 -->
    <g id="chevron-left"><g transform="translate(-4,-4)" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 1L2 4l3 3"/>
    </g></g>
  </defs>
  <rect x="8" y="8" width="344" height="200" rx="6" fill="#232323" stroke="#3a3a3a"/>
  <g>
    <rect x="16" y="17" width="20" height="20" rx="4" fill="#232323" stroke="#3a3a3a"/>
    <use xlink:href="#chevron-left" href="#chevron-left" x="26" y="27"/>
    <text x="44" y="31" font-size="11" fill="#9a9a9a">Client_Project_v27.aep</text>
    <text x="167" y="31" font-size="11" fill="#e0e0e0" opacity="0.5">/</text>
    <text x="176" y="31" font-size="11" font-weight="600" fill="#e0e0e0">HERO_Shot</text>
    <line x1="9" y1="47" x2="351" y2="47" stroke="#1c1c1c" stroke-width="1"/>
  </g>
  <g font-size="12">
    <!-- Controller -->
    <rect x="16" y="55" width="8" height="8" rx="2" fill="#c4605c"/>
    <use xlink:href="#target-icon" href="#target-icon" x="40" y="59" stroke="#4d9fff"/>
    <use xlink:href="#checkbox-on" href="#checkbox-on" x="64" y="59"/>
    <use xlink:href="#layer-scaffold" href="#layer-scaffold" x="84" y="59"/>
    <text x="103" y="63" fill="#e0e0e0">Controller</text>
    <line x1="12" y1="71" x2="348" y2="71" stroke="#1c1c1c" stroke-width="1"/>
    <!-- Glow_Gradient -->
    <rect x="16" y="79" width="8" height="8" rx="2" fill="#a89677"/>
    <use xlink:href="#target-icon" href="#target-icon" x="40" y="83" stroke="#4d9fff"/>
    <use xlink:href="#checkbox-on" href="#checkbox-on" x="64" y="83"/>
    <use xlink:href="#type-comp" href="#type-comp" x="84" y="83"/>
    <text x="103" y="87" fill="#e0e0e0">Glow_Gradient</text>
    <rect x="302" y="76" width="36" height="14" rx="3" fill="none" stroke="#444"/>
    <text x="320.0" y="86" font-size="10" fill="#9a9a9a" text-anchor="middle">MATTE</text>
    <line x1="12" y1="95" x2="348" y2="95" stroke="#1c1c1c" stroke-width="1"/>
    <!-- ColorWheel -->
    <rect x="16" y="103" width="8" height="8" rx="2" fill="#a89677"/>
    <use xlink:href="#checkbox-off" href="#checkbox-off" x="40" y="107"/>
    <use xlink:href="#type-comp" href="#type-comp" x="60" y="107"/>
    <text x="79" y="111" fill="#e0e0e0">ColorWheel</text>
    <rect x="302" y="100" width="36" height="14" rx="3" fill="none" stroke="#444"/>
    <text x="320.0" y="110" font-size="10" fill="#9a9a9a" text-anchor="middle">MATTE</text>
    <line x1="12" y1="119" x2="348" y2="119" stroke="#1c1c1c" stroke-width="1"/>
    <!-- Title Shadow -->
    <rect x="16" y="127" width="8" height="8" rx="2" fill="#c4605c"/>
    <use xlink:href="#checkbox-off" href="#checkbox-off" x="40" y="131"/>
    <use xlink:href="#layer-text" href="#layer-text" x="60" y="131"/>
    <text x="79" y="135" fill="#e0e0e0">Title Shadow</text>
    <text x="338" y="134" font-size="10" fill="#9a9a9a" text-anchor="end">↳ Main Title</text>
    <line x1="12" y1="143" x2="348" y2="143" stroke="#1c1c1c" stroke-width="1"/>
    <!-- Title Glow -->
    <rect x="16" y="151" width="8" height="8" rx="2" fill="#c4605c"/>
    <use xlink:href="#checkbox-off" href="#checkbox-off" x="40" y="155"/>
    <use xlink:href="#layer-text" href="#layer-text" x="60" y="155" opacity="0.55"/>
    <text x="79" y="159" fill="#6b6b6b">Title Glow</text>
    <line x1="12" y1="167" x2="348" y2="167" stroke="#1c1c1c" stroke-width="1"/>
    <!-- Main Title -->
    <rect x="16" y="175" width="8" height="8" rx="2" fill="#c4605c"/>
    <use xlink:href="#checkbox-off" href="#checkbox-off" x="40" y="179"/>
    <use xlink:href="#layer-text" href="#layer-text" x="60" y="179"/>
    <text x="79" y="183" fill="#e0e0e0">Main Title</text>
    <rect x="302" y="172" width="36" height="14" rx="3" fill="none" stroke="#444"/>
    <text x="320.0" y="182" font-size="10" fill="#9a9a9a" text-anchor="middle">MATTE</text>
    <line x1="12" y1="191" x2="348" y2="191" stroke="#1c1c1c" stroke-width="1"/>
  </g>
</svg>
