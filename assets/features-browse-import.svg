      <stop offset=".05" stop-color="#3b2275"/>
      <stop offset=".79" stop-color="#6678d1"/>
    </linearGradient>
    <g id="chevron-down"><path d="M-4,-1.5 L0,2.5 L4,-1.5" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <path id="folder-icon" d="M-6,-4.7 H-1.3 L0.3,-3 H6 C6.6,-3 7,-2.5 7,-2 V4.3 C7,4.9 6.6,5.3 6,5.3 H-6 C-6.6,5.3 -7,4.9 -7,4.3 V-3.7 C-7,-4.3 -6.6,-4.7 -6,-4.7 Z" fill="#9a9a9a"/>
    <g id="type-comp"><g transform="scale(0.5) translate(-12,-12)" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="12 2 2 7 12 12 22 7"/>
      <polyline points="2 17 12 22 22 17"/>
      <polyline points="2 12 12 17 22 12"/>
    </g></g>
    <g id="checkbox-off"><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.3"/></g>
    <g id="checkbox-on"><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="#4d9fff"/><path d="M-3.3,0.3 L-1.3,2.3 L3.3,-2.7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- Real target-icon: 13x13 display, viewBox 24x24 -> scale 13/24 -->
    <g id="target-icon"><g transform="scale(0.5417) translate(-12,-12)" fill="none" stroke-width="2"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="23"/><line x1="1" y1="12" x2="23" y2="12"/></g></g>
  </defs>

  <!-- Step 1: card tightened around the button, both centered on the shared row centerline (y=120) -->
  <rect x="30" y="84" width="284" height="72" rx="10" fill="#2b2b2b" stroke="#444"/>
  <path d="M55,109 H77 V131 H55 Q50,131 50,126 V114 Q50,109 55,109 Z" fill="#232323" stroke="#444"/>
  <g transform="translate(63,120) scale(0.5833)" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle r="9"/><polyline points="0,-5 0,0 4,2"/></g>
  <path d="M77,109 H277 Q282,109 282,114 V126 Q282,131 277,131 H77 Z" fill="#232323" stroke="#444"/>
  <text x="90" y="124" fill="#e0e0e0" font-size="12">Choose AEP, PSD or AI…</text>
  <text x="172" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">1 · Pick a source file</text>

  <g transform="translate(323,120) scale(0.351)"><path fill="url(#arrowGrad)" d="M3.18,-23.29 h76.42 c2.56,0,4.64,-2.09,4.61,-4.66 l-.23,-17.49 c-.03,-2.85,3.41,-4.29,5.42,-2.28 l46.42,45.86 c1.24,1.24,1.24,3.25,0,4.49 l-45.37,44.64 c-1.99,1.99,-5.39,.6,-5.42,-2.21 l-.24,-17.21 c-.03,-2.53,-2.08,-4.56,-4.61,-4.56 H3.18 c-1.75,0,-3.18,1.42,-3.18,3.18 V-20.11 c0,-1.75,1.42,-3.18,3.18,-3.18 Z"/></g>

  <!-- Step 2 -->
  <rect x="380" y="20" width="260" height="200" rx="10" fill="#2b2b2b" stroke="#444"/>
  <g font-size="12" fill="#e0e0e0">
    <use xlink:href="#chevron-down" href="#chevron-down" x="402" y="46"/>
    <use xlink:href="#folder-icon" href="#folder-icon" x="416" y="46"/>
    <text x="427" y="50" fill="#b8bcc2" font-weight="600" font-size="11">01_MAIN</text>

    <use xlink:href="#target-icon" href="#target-icon" x="428" y="74" stroke="#4d9fff"/>
    <use xlink:href="#checkbox-on" href="#checkbox-on" x="452" y="74"/>
    <use xlink:href="#type-comp" href="#type-comp" x="472" y="74"/>
    <text x="491" y="78" fill="#ffffff">HERO_Shot</text>

