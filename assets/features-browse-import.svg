    <use xlink:href="#folder-icon" href="#folder-icon" x="416" y="128"/>
    <text x="427" y="132" fill="#b8bcc2" font-weight="600" font-size="11">02_PRECOMPS</text>

    <use xlink:href="#target-icon" href="#target-icon" x="428" y="156" stroke="#9a9a9a"/>
    <use xlink:href="#checkbox-on" href="#checkbox-on" x="452" y="156"/>
    <use xlink:href="#type-comp" href="#type-comp" x="472" y="156"/>
    <text x="491" y="160" fill="#ffffff">robot_head_PRE</text>
  </g>
  <text x="510" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">2 · Check what you need</text>

  <g transform="translate(648,120) scale(0.351)"><path fill="url(#arrowGrad)" d="M3.18,-23.29 h53.63 c2.56,0,4.64,-2.09,4.61,-4.66 l-.23,-17.49 c-.03,-2.85,3.41,-4.29,5.42,-2.28 l46.42,45.86 c1.24,1.24,1.24,3.25,0,4.49 l-45.37,44.64 c-1.99,1.99,-5.39,.6,-5.42,-2.21 l-.24,-17.21 c-.03,-2.53,-2.08,-4.56,-4.61,-4.56 H3.18 c-1.75,0,-3.18,1.42,-3.18,3.18 V-20.11 c0,-1.75,1.42,-3.18,3.18,-3.18 Z"/></g>

  <!-- Step 3: card tightened around just the button, description moved outside as a caption -->
  <rect x="696" y="80" width="248" height="80" rx="10" fill="#2b2b2b" stroke="#444"/>
  <rect x="720" y="104" width="200" height="32" rx="6" fill="#4d9fff"/>
