<svg viewBox="0 0 414 422" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Arial">
  <!-- The host-side (ScriptUI) External Assets Found dialog, in the palette
       features-file-conflict.svg shares with it: body #1c1c1c, white title
       bar, panels stroked #3a3a3a, buttons #242424 on #4a4a4a. -->
  <rect width="414" height="422" fill="#1c1c1c"/>
  <rect width="414" height="36" fill="#fff"/>
  <text x="21" y="23" font-size="13" font-weight="bold" fill="#4a4a4a">AEP Transplant</text>

  <!-- heading: ScriptUI renders a "⚠" glyph, drawn as in features-file-conflict.svg -->
  <g transform="translate(23,54)" fill="none" stroke="#c9c9c9" stroke-width=".98" stroke-linejoin="round" stroke-linecap="round">
    <path d="M7 1.2 13.2 12.6 0.8 12.6Z"/>
    <line x1="7" y1="5.4" x2="7" y2="8.6"/>
  </g>
  <circle cx="30" cy="65.4" r=".9" fill="#c9c9c9"/>
  <text x="45" y="67" font-size="13" font-weight="bold" fill="#e6e6e6">External Assets Found</text>
  <line x1="21" y1="80" x2="393" y2="80" stroke="#3a3a3a"/>

  <text x="21" y="104" font-size="12" fill="#c9c9c9">3 assets used by "S12_Studio_v1.aep" are stored outside</text>
  <text x="21" y="122" font-size="12" fill="#c9c9c9">this project's folder.</text>
  <text x="21" y="150" font-size="12" fill="#c9c9c9">Copy them into the project, or keep linking to the original</text>
  <text x="21" y="168" font-size="12" fill="#c9c9c9">locations?</text>

  <!-- the asset list -->
  <rect x="21" y="184" width="372" height="76" rx="4.44" fill="none" stroke="#3a3a3a"/>
  <g font-size="12" fill="#d5d5d5">
    <text x="37" y="207">•  flower_texture.png</text>
    <text x="37" y="227">•  paper_grain.jpg</text>
    <text x="37" y="247">•  ambience_loop.wav</text>
  </g>

  <!-- where the copies go -->
  <rect x="21" y="272" width="372" height="76" rx="4.44" fill="none" stroke="#3a3a3a"/>
  <text x="37" y="298" font-size="12" font-weight="bold" fill="#c9c9c9">Copy to:</text>
  <text x="95" y="298" font-size="12" fill="#c9c9c9">Studio_Project/Footage</text>
  <rect x="293" y="280" width="84" height="27" rx="4.31" fill="#242424" stroke="#4a4a4a" stroke-width="1.27"/>
  <text x="335" y="297.5" font-size="12" fill="#e6e6e6" text-anchor="middle">Choose…</text>
  <rect x="37" y="318" width="13" height="13" rx="1.5" fill="none" stroke="#c9c9c9" stroke-width=".98"/>
  <path d="M39.8 324.6 42.6 327.4 47.4 321.4" fill="none" stroke="#c9c9c9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="329" font-size="12" fill="#c9c9c9">Create a subfolder</text>

  <rect x="21" y="360" width="372" height="50" rx="3.89" fill="none" stroke="#3a3a3a"/>
  <rect x="38" y="370" width="80" height="30.6" rx="4.31" fill="#242424" stroke="#4a4a4a" stroke-width="1.27"/>
  <text x="78" y="389" font-size="12" fill="#e6e6e6" text-anchor="middle">Cancel</text>
  <rect x="127" y="370" width="120" height="30.6" rx="4.31" fill="#242424" stroke="#4a4a4a" stroke-width="1.27"/>
  <text x="187" y="389" font-size="12" fill="#e6e6e6" text-anchor="middle">Copy to Project</text>
  <rect x="256" y="370" width="120" height="30.6" rx="4.31" fill="#242424" stroke="#4a4a4a" stroke-width="1.27"/>
  <text x="316" y="389" font-size="12" fill="#e6e6e6" text-anchor="middle">Leave in Place</text>
</svg>
