<svg viewBox="0 0 300 92" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Arial">
  <defs>
    <!-- Icons are the literal paths client/main.js renders (TYPE_ICON_SVG),
         left in their 0-24 space and scaled 0.5 here, since the panel draws
         them at 12x12 out of a 24x24 viewBox. -->
    <g id="px-comp"><g transform="scale(0.5) translate(-12,-12)" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"/>
      <polyline points="2 17 12 22 22 17"/>
      <polyline points="2 12 12 17 22 12"/>
    </g></g>
    <!-- media: solid frame with the play triangle cut out, hence evenodd -->
    <g id="px-media"><g transform="scale(0.5) translate(-12,-12)" fill="#9a9a9a" fill-rule="evenodd">
      <path d="M2 3h20v18H2V3zm8 5v8l6-4-6-4z"/>
    </g></g>
    <!-- design: what a .psd gets, and what an item using a .psd proxy shows -->
    <g id="px-design"><g transform="scale(0.5) translate(-12,-12)" fill="#9a9a9a">
      <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </g></g>
    <g id="px-checkbox"><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.3"/></g>
    <!-- .proxy-box: 11x11, 1px border, 1px padding, so a 7x7 fill inside -->
    <g id="px-proxy-off"><rect x="-5.5" y="-5.5" width="11" height="11" rx="1" fill="none" stroke="#9a9a9a"/></g>
    <g id="px-proxy-on"><rect x="-5.5" y="-5.5" width="11" height="11" rx="1" fill="none" stroke="#9a9a9a"/><rect x="-3.5" y="-3.5" width="7" height="7" fill="#9a9a9a"/></g>
  </defs>

  <rect x=".38" y=".38" width="299.24" height="91.24" rx="4.6" fill="#232323" stroke="#3a3a3a" stroke-width=".77"/>

  <!-- Row 1, y 1..31: a comp with a proxy attached but switched off -->
  <rect x="8.38" y="12.5" width="8" height="8" rx="2" fill="#A9CBC7"/>
  <use xlink:href="#px-checkbox" href="#px-checkbox" x="47.38" y="16"/>
  <use xlink:href="#px-proxy-off" href="#px-proxy-off" x="66.38" y="16"/>
  <use xlink:href="#px-comp" href="#px-comp" x="84.88" y="16"/>
  <text x="97.88" y="20" font-size="12" fill="#e0e0e0">GTHI26A_Hero_v4</text>

  <!-- Row 2, y 31..61: footage using a .psd proxy, so it takes that icon -->
  <rect x="8.38" y="42.5" width="8" height="8" rx="2" fill="#E7C19E"/>
  <use xlink:href="#px-checkbox" href="#px-checkbox" x="47.38" y="46"/>
  <use xlink:href="#px-proxy-on" href="#px-proxy-on" x="66.38" y="46"/>
  <use xlink:href="#px-design" href="#px-design" x="84.88" y="46"/>
  <text x="97.88" y="50" font-size="12" fill="#e0e0e0">GTHI26A_Hero_v4.mov</text>

  <!-- Row 3, y 61..91: no proxy, so no box exists and the icon sits left -->
  <rect x="8.38" y="72.5" width="8" height="8" rx="2" fill="#E7C19E"/>
  <use xlink:href="#px-checkbox" href="#px-checkbox" x="47.38" y="76"/>
  <use xlink:href="#px-media" href="#px-media" x="66.38" y="76"/>
  <text x="79.38" y="80" font-size="12" fill="#e0e0e0">GTHI26A_Plate_v1.mov</text>
</svg>
